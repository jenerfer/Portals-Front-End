<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Avatar — Portals</title>
  <link rel="stylesheet" href="https://jenerfer.github.io/Portals-Design-System/styles.css">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <script>
    (function(){var t=localStorage.getItem('portals-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();
    document.fonts.ready.then(function(){document.body.classList.add('fonts-loaded')});
    setTimeout(function(){document.body.classList.add('fonts-loaded')},2000);
  </script>
  <style>

    /* ===== Background ===== */

    .avatar-bg {
      position: fixed;
      top: -40px;
      left: -40px;
      right: -40px;
      bottom: -40px;
      background-image: url('assets/avatar/avatar-bg.jpeg');
      background-size: cover;
      background-position: center;
      filter: blur(0.7px);
      z-index: 0;
    }


    /* ===== Glass Container ===== */

    .avatar-glass {
      position: fixed;
      top: 40px;
      left: 40px;
      right: 40px;
      bottom: 40px;
      z-index: 1;
      background: rgb(71 71 71 / 28%);
      backdrop-filter: blur(25px) saturate(1.0) brightness(1.1);
      -webkit-backdrop-filter: blur(30px) saturate(1.0) brightness(1.1);
      border-radius: 35px;
      box-shadow:
        inset 1px 1px 20px 0px rgb(255 255 255 / 10%),
        inset 0px 0px 0 1px rgb(255 255 255 / 26%),
        -1px -1px 32px 5px rgb(0 0 0 / 20%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 40px;
    }


    /* ===== Fade-in Animation ===== */

    .avatar-fade {
      opacity: 0;
      filter: blur(10px);
      transition: opacity 1s ease-out, filter 1s ease-out;
    }

    .avatar-fade--visible {
      opacity: 1;
      filter: blur(0px);
    }


    /* ===== Header ===== */

    .avatar-header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      margin-bottom: 30px;
    }

    .avatar-header__title {
      margin-bottom: 0;
    }

    .avatar-header__close {
      position: absolute;
      right: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ice-4, #dce7f5);
      padding: 8px;
      transition: opacity 0.2s ease;
    }

    .avatar-header__close:hover {
      opacity: 0.7;
    }

    .avatar-header__close svg {
      display: block;
      width: 20px;
      height: 20px;
    }


    /* ===== Search Box (mobile header) ===== */

    .avatar-header__search {
      display: none;
    }


    /* ===== Icon Category Nav ===== */

    .avatar-nav {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 20px;
      flex-shrink: 0;
      margin-bottom: 40px;
    }

    .avatar-nav__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 19px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .avatar-nav__item:hover {
      transform: scale(1.08);
    }

    .avatar-nav__pill {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 52px;
      padding: 14px 23px;
      background: rgba(18, 22, 28, 0.12);
      border-radius: 948px;
      border: 2px solid transparent;
      color: var(--ice-5, #c4d5ed);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .avatar-nav__pill:hover {
      background: rgba(18, 22, 28, 0.20);
    }

    .avatar-nav__item--active .avatar-nav__pill {
      border-color: var(--blue-1, #6ac1ff);
      box-shadow: 0 0 12px 2px rgba(106, 193, 255, 0.3);
    }

    .avatar-nav__pill svg {
      display: block;
      width: 42px;
      height: 42px;
    }

    .avatar-nav__label {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 14px;
      line-height: 23px;
      text-align: center;
      color: var(--ice-7, #a9bee1);
      opacity: 0.54;
      transition: opacity 0.2s ease, color 0.2s ease;
      white-space: nowrap;
    }

    .avatar-nav__item--active .avatar-nav__label {
      color: var(--ice-4, #dce7f5);
      opacity: 1;
    }


    /* ===== Main Content ===== */

    .avatar-main {
      display: flex;
      gap: 26px;
      flex: 1;
      min-height: 0;
      max-width: 1026px;
      width: 100%;
      margin: 0 auto;
    }


    /* ===== Avatar Preview ===== */

    .avatar-preview {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 595px;
      flex-shrink: 1;
      padding-bottom: 40px;
    }

    .avatar-preview__label {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 18px;
      line-height: 33px;
      letter-spacing: -0.5px;
      color: var(--ice-4, #dce7f5);
    }

    .avatar-preview__window {
      flex: 1;
      min-height: 0;
      max-height: 700px;
      position: relative;
      background: rgba(0, 0, 0, 0.04);
      border-radius: 20px;
      overflow: hidden;
      -webkit-mask-image: radial-gradient(ellipse 90% 85% at center, black 65%, transparent 100%);
      mask-image: radial-gradient(ellipse 90% 85% at center, black 65%, transparent 100%);
    }

    .avatar-preview__window model-viewer::part(default-progress-bar) {
      display: none;
    }

    .avatar-preview__reset {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 1;
    }


    /* ===== Item Grid Panel ===== */

    .avatar-items {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 405px;
      flex-shrink: 1;
      min-height: 0;
    }

    .avatar-items__label {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 18px;
      line-height: 33px;
      letter-spacing: -0.5px;
      color: var(--ice-4, #dce7f5);
    }

    .avatar-items__search {
      background: rgba(0, 0, 0, 0.11);
      border-radius: 999px;
      padding: 11px 20px;
      border: 1px solid transparent;
      outline: none;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 16px;
      line-height: 28px;
      letter-spacing: -0.5px;
      color: var(--ice-4, #dce7f5);
      width: 100%;
      flex-shrink: 0;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .avatar-items__search::placeholder {
      color: var(--ice-4, #dce7f5);
      opacity: 0.6;
    }

    .avatar-items__search:focus {
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid var(--border-focus);
      color: var(--ice-1);
    }

    .avatar-items__grid-wrapper {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      padding-right: 5px;
      scrollbar-color: rgba(0, 0, 0, 0.03) transparent;
    }

    .avatar-items__grid-wrapper::-webkit-scrollbar {
      width: 3px;
    }

    .avatar-items__grid-wrapper::-webkit-scrollbar-track {
      background: transparent;
    }

    .avatar-items__grid-wrapper::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.03);
      border-radius: 3px;
    }

    .avatar-items__grid-wrapper::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.06);
    }

    .avatar-items__grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 15px;
    }

    .avatar-items__cell {
      aspect-ratio: 1 / 1;
      background: rgba(18, 22, 28, 0.08);
      border-radius: 17px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .avatar-items__cell:hover {
      background: rgba(18, 22, 28, 0.15);
    }


    /* ===== Mobile Grid Overlay ===== */

    .avatar-overlay-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .avatar-overlay-backdrop--visible {
      opacity: 1;
    }

    .avatar-overlay {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 80vh;
      z-index: 11;
      background: rgb(71 71 71 / 40%);
      backdrop-filter: blur(24px) saturate(1.0) brightness(1.1);
      -webkit-backdrop-filter: blur(30px) saturate(1.0) brightness(1.1);
      border-radius: 30px 30px 0 0;
      box-shadow:
        inset 1px 1px 20px 0px rgb(255 255 255 / 8%),
        inset 0px 0px 0 1px rgb(255 255 255 / 20%);
      padding: 16px 27px 35px;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }

    .avatar-overlay--visible {
      transform: translateY(0);
    }

    .avatar-overlay__handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      margin: 0 auto 20px;
      flex-shrink: 0;
      cursor: grab;
    }

    .avatar-overlay__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .avatar-overlay__label {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 16px;
      line-height: 28px;
      letter-spacing: -0.5px;
      color: var(--ice-4, #dce7f5);
    }

    .avatar-overlay__search {
      background: rgba(0, 0, 0, 0.11);
      border-radius: 999px;
      padding: 8px 16px;
      border: 1px solid transparent;
      outline: none;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 14px;
      line-height: 24px;
      letter-spacing: -0.5px;
      color: var(--ice-4, #dce7f5);
      width: 240px;
    }

    .avatar-overlay__search::placeholder {
      color: var(--ice-4, #dce7f5);
      opacity: 0.6;
    }

    .avatar-overlay__search:focus {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-focus);
      color: var(--ice-1);
    }

    .avatar-overlay__grid-wrapper {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .avatar-overlay__grid-wrapper::-webkit-scrollbar {
      width: 4px;
    }

    .avatar-overlay__grid-wrapper::-webkit-scrollbar-track {
      background: transparent;
    }

    .avatar-overlay__grid-wrapper::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }

    .avatar-overlay__grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 12px;
    }

    .avatar-overlay__cell {
      aspect-ratio: 1 / 1;
      background: rgba(18, 22, 28, 0.08);
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .avatar-overlay__cell:hover {
      background: rgba(18, 22, 28, 0.15);
    }


    /* ===== Tablet (≤1024px) ===== */

    @media (max-width: 1024px) {
      .avatar-glass {
        top: 30px;
        left: 30px;
        right: 30px;
        bottom: 30px;
        padding: 30px;
      }

      .avatar-preview {
        width: auto;
        flex: 1;
        min-width: 0;
      }

      .avatar-preview__window {
        width: 100%;
        height: 350px;
      }

      .avatar-items {
        width: auto;
        flex: 1;
        min-width: 0;
      }


      .avatar-nav {
        gap: 15px;
        margin-left: -30px;
        margin-right: -30px;
        padding: 0 30px;
        overflow-x: auto;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .avatar-nav::-webkit-scrollbar {
        display: none;
      }

      .avatar-nav__pill {
        height: 46px;
        padding: 12px 18px;
      }

      .avatar-nav__pill svg {
        width: 36px;
        height: 36px;
      }

      .avatar-nav__label {
        font-size: 12px;
      }
    }


    /* ===== Mobile (≤768px) ===== */

    @media (max-width: 768px) {
      .avatar-glass {
        top: 27px;
        left: 27px;
        right: 27px;
        bottom: 35px;
        padding: 27px;
      }

      .avatar-header {
        margin-bottom: 20px;
      }



      .avatar-nav {
        gap: 16px;
        margin-left: -27px;
        margin-right: -27px;
        padding: 0 27px;
        margin-bottom: 30px;
        overflow-x: auto;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .avatar-nav::-webkit-scrollbar {
        display: none;
      }

      .avatar-nav__item {
        gap: 15px;
      }

      .avatar-nav__pill {
        height: 41px;
        padding: 11px 18px;
      }

      .avatar-nav__pill svg {
        width: 33px;
        height: 33px;
      }

      .avatar-nav__label {
        font-size: 11px;
        line-height: 18px;
        color: var(--ice-0, white);
      }

      .avatar-nav__item--active .avatar-nav__label {
        color: var(--ice-0, white);
      }

      .avatar-main {
        flex-direction: column;
        align-items: center;
      }

      .avatar-preview {
        width: 100%;
        align-items: center;
      }

      .avatar-preview__label {
        display: none;
      }

      .avatar-preview__window {
        width: 100%;
        height: 300px;
        -webkit-mask-image: none;
        mask-image: none;
      }

      .avatar-items {
        display: none;
      }

      .avatar-overlay-backdrop {
        display: block;
        pointer-events: none;
      }

      .avatar-overlay-backdrop--visible {
        pointer-events: auto;
      }

      .avatar-overlay {
        display: flex;
      }
    }


    /* ===== Small Mobile (≤480px) ===== */

    @media (max-width: 480px) {
      .avatar-glass {
        top: 20px;
        left: 16px;
        right: 16px;
        bottom: 28px;
        padding: 20px;
        border-radius: 28px;
      }

      .avatar-nav {
        margin-left: -20px;
        margin-right: -20px;
        padding: 0 20px;
      }
    }

  </style>
</head>
<body>

  <!-- Background -->
  <div class="avatar-bg"></div>

  <!-- Glass Container -->
  <div class="avatar-glass avatar-fade">

    <!-- Header -->
    <div class="avatar-header">
      <h1 class="avatar-header__title h3-bold">my avatar</h1>
      <input type="text" class="avatar-header__search" placeholder="search">
      <button class="avatar-header__close" id="avatar-close" aria-label="Close">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 1L19 19M19 1L1 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Icon Category Nav -->
    <nav class="avatar-nav" id="avatar-nav">

      <!-- hair -->
      <div class="avatar-nav__item" data-category="hair">
        <div class="avatar-nav__pill">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">

          </svg>
        </div>
        <span class="avatar-nav__label">hair</span>
      </div>

      <!-- skin color -->
      <div class="avatar-nav__item" data-category="skin">
        <div class="avatar-nav__pill">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M20.3883 30.622C18.5533 31.9285 16.3244 32.6943 13.921 32.6943C7.65221 32.6943 2.57031 27.4845 2.57031 21.0581C2.57031 14.6316 7.65221 9.42188 13.921 9.42188C16.3244 9.42188 18.5533 10.1876 20.3883 11.4941C22.2233 10.1876 24.4521 9.42188 26.8556 9.42188C33.1243 9.42188 38.2063 14.6316 38.2063 21.0581C38.2063 27.4845 33.1243 32.6943 26.8556 32.6943C24.4521 32.6943 22.2233 31.9285 20.3883 30.622ZM18.342 28.7543C17.046 29.5385 15.5348 29.9882 13.921 29.9882C9.11006 29.9882 5.21001 25.99 5.21001 21.0581C5.21001 16.1261 9.11006 12.128 13.921 12.128C15.5348 12.128 17.046 12.5778 18.342 13.3619C16.5762 15.4131 15.5048 18.1073 15.5048 21.0581C15.5048 24.0088 16.5762 26.703 18.342 28.7543Z" fill="currentColor"/>
          </svg>
        </div>
        <span class="avatar-nav__label">skin color</span>
      </div>

      <!-- tops -->
      <div class="avatar-nav__item" data-category="tops">
        <div class="avatar-nav__pill">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11.999 9.46957C12.0014 9.4736 12.0076 9.47192 12.0076 9.46725C12.0076 9.46472 12.0096 9.46266 12.0122 9.46266H14.104C14.7887 9.46266 15.3494 9.9802 15.591 10.6209C16.347 12.6251 18.2971 14.0525 20.5847 14.0525C22.8722 14.0524 24.8217 12.625 25.5775 10.6209C25.8191 9.98019 26.3798 9.46266 27.0645 9.46266H29.3622C29.3772 9.46266 29.3894 9.47487 29.3894 9.48992C29.3894 9.51773 29.4262 9.52768 29.4402 9.50367L29.4695 9.45353C29.4814 9.43317 29.5075 9.42619 29.5279 9.4379L35.6312 12.9271C36.2894 13.3034 36.5146 14.144 36.1327 14.799L33.4675 19.37C33.0901 20.0171 32.2616 20.239 31.6113 19.8671L31.4313 19.7642C30.5216 19.2439 29.3894 19.9007 29.3894 20.9486V32.8843C29.3894 33.6379 28.7785 34.2488 28.0249 34.2488H13.3721C12.6185 34.2488 12.0076 33.6379 12.0076 32.8843V20.9828C12.0076 19.9349 10.8754 19.2781 9.96571 19.7984L9.84732 19.8661C9.19698 20.238 8.36841 20.016 7.99112 19.3688L5.32653 14.7979C4.94476 14.143 5.16999 13.3024 5.82806 12.9262L11.953 9.42411C11.9611 9.4195 11.9713 9.42224 11.976 9.43026L11.999 9.46957Z" fill="currentColor"/>
          </svg>
        </div>
        <span class="avatar-nav__label">tops</span>
      </div>

      <!-- bottoms -->
      <div class="avatar-nav__item avatar-nav__item--active" data-category="bottoms">

  <script>
    (function () {

      /* ===== Fade-in on load ===== */
      var glass = document.querySelector('.avatar-fade');
      if (glass) {
        requestAnimationFrame(function () {
          glass.classList.add('avatar-fade--visible');
        });
      }


      /* ===== Reset View button ===== */
      var resetBtn = document.getElementById('reset-view');
      var viewer = document.getElementById('avatar-viewer');
      if (resetBtn && viewer) {
        resetBtn.addEventListener('click', function () {
          viewer.cameraOrbit = '0deg 75deg 100%';
          viewer.fieldOfView = '37deg';
          viewer.cameraTarget = 'auto auto auto';
          viewer.jumpCameraToGoal();
        });
      }


      /* ===== Close button ===== */
      var closeBtn = document.getElementById('avatar-close');
      if (closeBtn) {
        closeBtn.addEventListener('click', function () {
          var glass = document.querySelector('.avatar-fade');
          if (glass) {
            glass.classList.remove('avatar-fade--visible');
            glass.addEventListener('transitionend', function () {
              if (window.history.length > 1) {
                window.history.back();
              } else {
                window.location.href = 'profile.html';
              }
            }, { once: true });
          }
        });
      }


      /* ===== Category Nav ===== */
      var navItems = document.querySelectorAll('.avatar-nav__item');
      var isMobile = function () { return window.innerWidth <= 768; };

      navItems.forEach(function (item) {
        item.addEventListener('click', function () {
          navItems.forEach(function (n) { n.classList.remove('avatar-nav__item--active'); });
          item.classList.add('avatar-nav__item--active');

          // On mobile, open the grid overlay
          if (isMobile()) {
            openOverlay();
          }
        });
      });


      /* ===== Mobile Grid Overlay ===== */
      var backdrop = document.getElementById('overlay-backdrop');
      var panel = document.getElementById('overlay-panel');
      var handle = document.getElementById('overlay-handle');
      var isOverlayOpen = false;

      function openOverlay() {
        if (!panel || !backdrop) return;
        isOverlayOpen = true;
        backdrop.classList.add('avatar-overlay-backdrop--visible');
        // Force reflow before adding visible class for transition
        panel.offsetHeight;
        panel.classList.add('avatar-overlay--visible');
      }

      function closeOverlay() {
        if (!panel || !backdrop) return;
        isOverlayOpen = false;
        panel.classList.remove('avatar-overlay--visible');
        backdrop.classList.remove('avatar-overlay-backdrop--visible');
        panel.style.transform = '';
      }

      // Tap backdrop to close
      if (backdrop) {
        backdrop.addEventListener('click', closeOverlay);
      }


      /* ===== Swipe-to-close gesture ===== */
      var startY = 0;
      var currentY = 0;
      var isDragging = false;

      if (panel) {
        panel.addEventListener('touchstart', function (e) {
          // Only start drag from the handle or top area
          var touch = e.touches[0];
          var panelRect = panel.getBoundingClientRect();
          // Allow drag from top 60px of the overlay
          if (touch.clientY - panelRect.top < 60) {
            isDragging = true;
            startY = touch.clientY;
            currentY = startY;
            panel.style.transition = 'none';
          }
        }, { passive: true });

        panel.addEventListener('touchmove', function (e) {
          if (!isDragging) return;
          currentY = e.touches[0].clientY;
          var diff = currentY - startY;
          // Only allow dragging down
          if (diff > 0) {
            panel.style.transform = 'translateY(' + diff + 'px)';
          }
        }, { passive: true });

        panel.addEventListener('touchend', function () {
          if (!isDragging) return;
          isDragging = false;
          panel.style.transition = '';
          var diff = currentY - startY;
          // Close if dragged down more than 80px
          if (diff > 80) {
            closeOverlay();
          } else {
            // Snap back
            panel.style.transform = '';
            if (isOverlayOpen) {
              panel.classList.add('avatar-overlay--visible');
            }
          }
        }, { passive: true });
      }

    })();
  </script>

</body>
</html>
